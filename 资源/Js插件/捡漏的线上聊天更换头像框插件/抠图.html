<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>智能抠图 & 水印消除工具</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface-light: #1f2b4d;
            --border: #2a3a5e;
            --text: #e0e0e0;
            --text-dim: #8888aa;
            --accent: #4f8cf7;
            --accent-hover: #6ba0f8;
            --danger: #e74c5e;
            --danger-hover: #f06a7a;
            --success: #2ecc71;
            --success-hover: #4ade80;
            --warning: #f39c12;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ========== 顶部栏 ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .logo svg {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-light);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.3px;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #283858;
            border-color: #3a4e78;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
            background: #1e2b4a;
        }
        .btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: var(--success-hover);
            border-color: var(--success-hover);
        }
        .btn-danger {
            background: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            pointer-events: none;
        }
        .btn-sm {
            padding: 5px 8px;
            font-size: 12px;
            gap: 3px;
        }
        .btn-sm svg {
            width: 13px;
            height: 13px;
        }

        /* ========== 主内容 ========== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* ========== 左侧工具栏 ========== */
        .toolbar {
            width: 210px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 5;
        }
        .toolbar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toolbar-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
            width: 100%;
            font-weight: 500;
            letter-spacing: 0.3px;
            touch-action: manipulation;
        }
        .tool-btn:hover {
            background: var(--surface-light);
            border-color: var(--border);
        }
        .tool-btn.active {
            background: var(--surface-light);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }
        .tool-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .tool-btn .tool-key {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-dim);
            background: var(--bg);
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: 400;
        }
        .tool-btn.active .tool-key {
            color: var(--accent);
            background: rgba(79, 140, 247, 0.15);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
        }
        .slider-label span:last-child {
            color: var(--text);
            font-weight: 600;
            min-width: 28px;
            text-align: right;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
            cursor: pointer;
            transition: background var(--transition);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: all var(--transition);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: var(--accent-hover);
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* ========== 画布区域 ========== */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #0f0f1a;
            min-width: 0;
            min-height: 0;
            cursor: crosshair;
            touch-action: none;
        }
        .canvas-area .checkerboard-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, #2a2a3a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a3a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a3a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a3a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #1e1e2e;
            opacity: 0.6;
        }
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #mainCanvas {
            max-width: calc(100% - 40px);
            max-height: calc(100% - 40px);
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            image-rendering: auto;
            touch-action: none;
        }
        .brush-cursor {
            position: absolute;
            pointer-events: none;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 12px rgba(255, 255, 255, 0.3);
            z-index: 10;
            display: none;
            transition: width 0.1s, height 0.1s;
        }
        .canvas-empty-state {
            position: absolute;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            pointer-events: none;
            color: var(--text-dim);
            text-align: center;
            padding: 20px;
        }
        .canvas-empty-state svg {
            width: 56px;
            height: 56px;
            fill: var(--text-dim);
            opacity: 0.5;
        }
        .canvas-empty-state p {
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .canvas-empty-state .hint {
            font-size: 12px;
            color: #555;
        }

        /* ========== 右侧预览面板 ========== */
        .preview-panel {
            width: 220px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 5;
        }
        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .preview-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }
        .preview-box {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background-image:
                linear-gradient(45deg, #2a2a3a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a3a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a3a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a3a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #1e1e2e;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #previewCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }
        .preview-empty {
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
            padding: 20px;
            position: absolute;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: var(--text-dim);
            padding: 10px;
            background: var(--surface-light);
            border-radius: var(--radius-sm);
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-row span:last-child {
            color: var(--text);
            font-weight: 600;
            font-size: 12px;
        }
        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ========== 提示消息 ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface-light);
            color: var(--text);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 13px;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式优化 (手机端) ========== */
        @media (max-width: 768px) {
            .header {
                padding: 6px 8px;
                gap: 4px;
            }
            .logo {
                font-size: 14px;
                gap: 4px;
            }
            .logo svg {
                width: 20px;
                height: 20px;
            }
            .btn {
                padding: 6px 8px;
                font-size: 11px;
                gap: 3px;
                border-radius: 6px;
            }
            .btn svg {
                width: 14px;
                height: 14px;
            }
            .main {
                flex-direction: column;
            }
            .toolbar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 6px 8px;
                gap: 6px;
                max-height: 110px;
                overflow-y: auto;
                justify-content: flex-start;
            }
            .toolbar-section {
                flex-direction: row;
                align-items: center;
                gap: 5px;
                flex-wrap: wrap;
            }
            .toolbar-section-title {
                display: none;
            }
            .tool-group {
                flex-direction: row;
                gap: 4px;
                flex-wrap: wrap;
            }
            .tool-btn {
                width: auto;
                padding: 7px 8px;
                font-size: 12px;
                gap: 4px;
                border-radius: 6px;
            }
            .tool-btn .tool-key {
                display: none;
            }
            .tool-btn svg {
                width: 16px;
                height: 16px;
            }
            .slider-group {
                flex-direction: column;
                gap: 2px;
            }
            .slider-label {
                font-size: 11px;
            }
            input[type="range"] {
                width: 80px;
            }
            .checkbox-group {
                font-size: 11px;
                gap: 4px;
            }
            .preview-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                border-left: none;
                border-top: 1px solid var(--border);
                padding: 6px 8px;
                max-height: 120px;
                gap: 6px;
                align-items: center;
            }
            .preview-box {
                width: 70px;
                height: 70px;
                aspect-ratio: auto;
            }
            .stats {
                flex: 1;
                min-width: 120px;
                padding: 5px 6px;
                font-size: 10px;
                gap: 2px;
            }
            .canvas-area .checkerboard-bg {
                background-size: 14px 14px;
            }
            .canvas-empty-state svg {
                width: 40px;
                height: 40px;
            }
            .canvas-empty-state p {
                font-size: 13px;
            }
            .canvas-empty-state .hint {
                font-size: 10px;
            }
            .brush-cursor {
                border-width: 1.5px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 顶部栏 -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    智能抠图
                </div>
            </div>
            <div class="header-actions">
                <button class="btn" id="btnUpload" title="上传图片">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    上传
                </button>
                <button class="btn" id="btnUndo" title="撤销 (Ctrl+Z)" disabled>
                    <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                    撤销
                </button>
                <button class="btn" id="btnReset" title="重置所有更改" disabled>
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    重置
                </button>
                <button class="btn btn-success" id="btnDownload" title="下载透明PNG" disabled>
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    下载
                </button>
            </div>
        </header>

        <!-- 主内容 -->
        <div class="main">
            <!-- 左侧工具栏 -->
            <aside class="toolbar">
                <div class="toolbar-section">
                    <div class="toolbar-section-title">工具</div>
                    <div class="tool-group">
                        <button class="tool-btn active" data-tool="wand" title="魔棒工具 - 点击选择相似颜色区域">
                            <svg viewBox="0 0 24 24"><path d="M7.5 5.6L10 7 8.6 4.5 10 2 7.5 3.4 5 2l1.4 2.5L5 7l2.5-1.4zm10 0L20 7l-1.4-2.5L20 2l-2.5 1.4L15 2l1.4 2.5L15 7l2.5-1.4zM22 11l-2.5-1.4L17 11l1.4-2.5L17 6l2.5 1.4L22 6l-1.4 2.5L22 11zM3 13l2.5 1.4L8 13l-1.4 2.5L8 18l-2.5-1.4L3 18l1.4-2.5L3 13zm16.5-3.5L22 11l-1.4-2.5L22 6l-2.5 1.4L17 6l1.4 2.5L17 11l2.5-1.4zM3.5 6.5L6 8 4.6 5.5 6 3 3.5 4.4 1 3l1.4 2.5L1 8l2.5-1.5z"/></svg>
                            魔棒
                            <span class="tool-key">W</span>
                        </button>
                        <button class="tool-btn" data-tool="erase" title="画笔擦除 - 将像素设为透明">
                            <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.2 4.2c.78.78.78 2.05 0 2.83L12 19.03c-.78.78-2.05.78-2.83 0l-4.2-4.2c-.78-.78-.78-2.05 0-2.83l8.44-8.44c.78-.78 2.05-.78 2.83 0zM5 21h14v-2H5v2z"/></svg>
                            擦除
                            <span class="tool-key">B</span>
                        </button>
                        <button class="tool-btn" data-tool="restore" title="画笔恢复 - 恢复原始像素">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                            恢复
                            <span class="tool-key">R</span>
                        </button>
                        <button class="tool-btn" data-tool="heal" title="修复画笔 - 涂抹水印区域进行消除">
                            <svg viewBox="0 0 24 24"><path d="M17.66 11.2c-.23-.3-.51-.56-.77-.82-.67-.6-1.43-1.03-2.07-1.66C13.33 7.26 13 4.85 13.95 3c-.95.23-1.78.75-2.49 1.32-2.59 2.08-3.61 5.75-2.39 8.9.34.88.91 1.66 1.45 2.43.57.81 1.06 1.69 1.69 2.41.97 1.11 2.31 1.83 3.77 2.28 1.23.38 2.61.4 3.55-.66.45-.5.67-1.18.67-1.87 0-.88-.36-1.71-.82-2.48-.3-.51-.66-1.01-.92-1.55-.31-.66-.72-1.29-.87-2.01-.2-.94-.16-1.98.32-2.78 1.68-2.78 4.69-4.02 7.73-3.1-.01-1.22-.72-2.31-1.66-3.1zM7.28 20.02c1.5-.32 2.95-.93 4.12-1.86-.49-.3-.95-.67-1.37-1.08-.42-.41-.78-.87-1.12-1.33-.55-.75-1.08-1.55-1.46-2.42-.38-.87-.6-1.82-.45-2.76.08-.45.24-.86.48-1.24-.4.06-.79.17-1.17.32-1.38.55-2.54 1.5-3.29 2.81-.74 1.29-.97 2.7-.58 4.11.41 1.48 1.31 2.69 2.84 3.45z"/></svg>
                            修复
                            <span class="tool-key">H</span>
                        </button>
                    </div>
                </div>

                <div class="toolbar-section">
                    <div class="toolbar-section-title">参数</div>
                    <div class="slider-group" id="sliderToleranceGroup">
                        <div class="slider-label">
                            <span>容差</span>
                            <span id="toleranceValue">30</span>
                        </div>
                        <input type="range" id="toleranceSlider" min="1" max="100" value="30">
                    </div>
                    <div class="slider-group" id="sliderBrushGroup">
                        <div class="slider-label">
                            <span>画笔大小</span>
                            <span id="brushSizeValue">20</span>
                        </div>
                        <input type="range" id="brushSizeSlider" min="1" max="120" value="20">
                    </div>
                    <div class="checkbox-group" id="softBrushGroup">
                        <input type="checkbox" id="softBrushCheck" checked>
                        <label for="softBrushCheck">柔边</label>
                    </div>
                    <div class="checkbox-group" id="featherGroup">
                        <input type="checkbox" id="featherCheck">
                        <label for="featherCheck">羽化</label>
                    </div>
                    <div class="slider-group" id="sliderFeatherGroup" style="display:none;">
                        <div class="slider-label">
                            <span>羽化半径</span>
                            <span id="featherValue">3</span>
                        </div>
                        <input type="range" id="featherSlider" min="1" max="15" value="3">
                    </div>
                </div>

                <div class="toolbar-section">
                    <div class="toolbar-section-title">操作</div>
                    <button class="btn btn-sm" id="btnAutoCut" disabled title="自动检测背景并移除">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        自动抠图
                    </button>
                    <button class="btn btn-sm btn-danger" id="btnInvert" disabled>
                        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                        反选
                    </button>
                </div>
            </aside>

            <!-- 画布区域 -->
            <div class="canvas-area" id="canvasArea">
                <div class="checkerboard-bg"></div>
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="mainCanvas"></canvas>
                    <div class="brush-cursor" id="brushCursor"></div>
                    <div class="canvas-empty-state" id="emptyState">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        <p>上传图片开始编辑</p>
                        <span class="hint">支持 JPG / PNG / WebP 等格式</span>
                    </div>
                </div>
            </div>

            <!-- 右侧预览 -->
            <aside class="preview-panel">
                <div class="preview-container">
                    <div class="preview-label">实时预览</div>
                    <div class="preview-box">
                        <canvas id="previewCanvas"></canvas>
                        <div class="preview-empty" id="previewEmpty">暂无图片</div>
                    </div>
                </div>
                <div class="stats" id="statsPanel" style="display:none;">
                    <div class="stats-row">
                        <span>原始尺寸</span>
                        <span id="statSize">-</span>
                    </div>
                    <div class="stats-row">
                        <span>已抠除</span>
                        <span id="statRemoved">0%</span>
                    </div>
                    <div class="stats-row">
                        <span>剩余不透明</span>
                        <span id="statRemaining">100%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" id="statProgress"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const mainCanvas = document.getElementById('mainCanvas');
            const previewCanvas = document.getElementById('previewCanvas');
            const canvasArea = document.getElementById('canvasArea');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const brushCursor = document.getElementById('brushCursor');
            const emptyState = document.getElementById('emptyState');
            const previewEmpty = document.getElementById('previewEmpty');
            const fileInput = document.getElementById('fileInput');
            const toast = document.getElementById('toast');
            const statsPanel = document.getElementById('statsPanel');

            const btnUpload = document.getElementById('btnUpload');
            const btnUndo = document.getElementById('btnUndo');
            const btnReset = document.getElementById('btnReset');
            const btnDownload = document.getElementById('btnDownload');
            const btnAutoCut = document.getElementById('btnAutoCut');
            const btnInvert = document.getElementById('btnInvert');

            const toolButtons = document.querySelectorAll('.tool-btn');
            const toleranceSlider = document.getElementById('toleranceSlider');
            const toleranceValue = document.getElementById('toleranceValue');
            const brushSizeSlider = document.getElementById('brushSizeSlider');
            const brushSizeValue = document.getElementById('brushSizeValue');
            const softBrushCheck = document.getElementById('softBrushCheck');
            const featherCheck = document.getElementById('featherCheck');
            const featherSlider = document.getElementById('featherSlider');
            const featherValue = document.getElementById('featherValue');
            const sliderFeatherGroup = document.getElementById('sliderFeatherGroup');
            const sliderToleranceGroup = document.getElementById('sliderToleranceGroup');
            const sliderBrushGroup = document.getElementById('sliderBrushGroup');

            const statSize = document.getElementById('statSize');
            const statRemoved = document.getElementById('statRemoved');
            const statRemaining = document.getElementById('statRemaining');
            const statProgress = document.getElementById('statProgress');

            // ==================== 状态 ====================
            let currentTool = 'wand'; // 'wand' | 'erase' | 'restore' | 'heal'
            let tolerance = 30;
            let brushSize = 20;
            let softBrush = true;
            let featherEnabled = false;
            let featherRadius = 3;

            let originalImageData = null;
            let originalImage = null;
            let imageWidth = 0;
            let imageHeight = 0;
            let alphaMask = null;
            let history = [];
            const MAX_HISTORY = 30;
            let isDrawing = false;
            let lastDrawX = -1;
            let lastDrawY = -1;
            let hasImage = false;
            let isLoaded = false;

            let scaleX = 1;
            let scaleY = 1;
            let displayScale = 1;

            // 触摸缩放相关
            let initialDistance = 0;
            let initialScale = 1;

            // ==================== 初始化 ====================
            function init() {
                setupEventListeners();
                updateToolUI();
                updateSlidersUI();
                resetCanvas();
            }

            // ==================== 事件监听 ====================
            function setupEventListeners() {
                btnUpload.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', handleFileUpload);

                canvasArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    canvasArea.style.borderColor = 'var(--accent)';
                });
                canvasArea.addEventListener('dragleave', () => {
                    canvasArea.style.borderColor = 'transparent';
                });
                canvasArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    canvasArea.style.borderColor = 'transparent';
                    const files = e.dataTransfer.files;
                    if (files.length > 0 && files[0].type.startsWith('image/')) {
                        loadImageFile(files[0]);
                    }
                });

                toolButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        setTool(btn.dataset.tool);
                    });
                });

                toleranceSlider.addEventListener('input', () => {
                    tolerance = parseInt(toleranceSlider.value);
                    toleranceValue.textContent = tolerance;
                });
                brushSizeSlider.addEventListener('input', () => {
                    brushSize = parseInt(brushSizeSlider.value);
                    brushSizeValue.textContent = brushSize;
                    updateBrushCursorSize();
                });
                featherSlider.addEventListener('input', () => {
                    featherRadius = parseInt(featherSlider.value);
                    featherValue.textContent = featherRadius;
                });

                softBrushCheck.addEventListener('change', () => {
                    softBrush = softBrushCheck.checked;
                });
                featherCheck.addEventListener('change', () => {
                    featherEnabled = featherCheck.checked;
                    sliderFeatherGroup.style.display = featherEnabled ? 'flex' : 'none';
                    if (featherEnabled && hasImage) {
                        applyFeather();
                    }
                });

                btnUndo.addEventListener('click', undo);
                btnReset.addEventListener('click', resetMask);
                btnDownload.addEventListener('click', downloadPNG);
                btnAutoCut.addEventListener('click', autoCut);
                btnInvert.addEventListener('click', invertMask);

                document.addEventListener('keydown', handleKeyboard);

                // 鼠标事件
                mainCanvas.addEventListener('mousedown', handleMouseDown);
                mainCanvas.addEventListener('mousemove', handleMouseMove);
                mainCanvas.addEventListener('mouseup', handleMouseUp);
                mainCanvas.addEventListener('mouseleave', handleMouseLeave);
                mainCanvas.addEventListener('mouseenter', handleMouseEnter);

                // 触摸事件（用于单指绘制）
                mainCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                mainCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
                mainCanvas.addEventListener('touchend', handleTouchEnd, { passive: false });
                mainCanvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

                // 双指缩放（作用于画布容器）
                canvasArea.addEventListener('touchstart', handleCanvasTouchStart, { passive: false });
                canvasArea.addEventListener('touchmove', handleCanvasTouchMove, { passive: false });
                canvasArea.addEventListener('touchend', handleCanvasTouchEnd, { passive: false });

                // 滚轮缩放
                canvasArea.addEventListener('wheel', handleWheel, { passive: false });

                window.addEventListener('resize', () => {
                    if (hasImage) {
                        fitCanvasToContainer();
                        renderMainCanvas();
                        renderPreview();
                    }
                });
            }

            // ==================== 键盘快捷键 ====================
            function handleKeyboard(e) {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
                if (!e.ctrlKey && !e.metaKey) {
                    switch (e.key.toLowerCase()) {
                        case 'w': setTool('wand'); break;
                        case 'b': setTool('erase'); break;
                        case 'r': setTool('restore'); break;
                        case 'h': setTool('heal'); break;
                        case '[':
                            brushSize = Math.max(1, brushSize - 2);
                            brushSizeSlider.value = brushSize;
                            brushSizeValue.textContent = brushSize;
                            updateBrushCursorSize();
                            break;
                        case ']':
                            brushSize = Math.min(120, brushSize + 2);
                            brushSizeSlider.value = brushSize;
                            brushSizeValue.textContent = brushSize;
                            updateBrushCursorSize();
                            break;
                    }
                }
            }

            // ==================== 工具管理 ====================
            function setTool(tool) {
                currentTool = tool;
                toolButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tool === tool);
                });
                updateToolUI();
                updateBrushCursor();
            }

            function updateToolUI() {
                const isWand = currentTool === 'wand';
                const isBrush = currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal';
                sliderToleranceGroup.style.display = isWand ? 'flex' : 'none';
                sliderBrushGroup.style.display = isBrush ? 'flex' : 'none';
                document.getElementById('softBrushGroup').style.display = isBrush ? 'flex' : 'none';
                document.getElementById('featherGroup').style.display = (isWand || isBrush) ? 'flex' : 'none';
                sliderFeatherGroup.style.display = (featherEnabled && (isWand || isBrush)) ? 'flex' : 'none';

                mainCanvas.style.cursor = isBrush ? 'none' : 'crosshair';
                updateBrushCursor();
            }

            function updateBrushCursor() {
                const isBrush = currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal';
                if (isBrush && hasImage) {
                    brushCursor.style.display = 'block';
                    updateBrushCursorSize();
                } else {
                    brushCursor.style.display = 'none';
                }
            }

            function updateBrushCursorSize() {
                const displaySize = brushSize * displayScale;
                brushCursor.style.width = displaySize + 'px';
                brushCursor.style.height = displaySize + 'px';
                brushCursor.style.marginLeft = (-displaySize / 2) + 'px';
                brushCursor.style.marginTop = (-displaySize / 2) + 'px';
                brushCursor.style.borderRadius = '50%';
                if (currentTool === 'erase') {
                    brushCursor.style.borderColor = '#ff6b6b';
                    brushCursor.style.boxShadow = '0 0 0 1px rgba(0,0,0,0.5), 0 0 14px rgba(255,107,107,0.5)';
                } else if (currentTool === 'restore') {
                    brushCursor.style.borderColor = '#4ade80';
                    brushCursor.style.boxShadow = '0 0 0 1px rgba(0,0,0,0.5), 0 0 14px rgba(74,222,128,0.5)';
                } else if (currentTool === 'heal') {
                    brushCursor.style.borderColor = '#f39c12';
                    brushCursor.style.boxShadow = '0 0 0 1px rgba(0,0,0,0.5), 0 0 14px rgba(243,156,18,0.5)';
                } else {
                    brushCursor.style.borderColor = '#fff';
                    brushCursor.style.boxShadow = '0 0 0 1px rgba(0,0,0,0.5), 0 0 12px rgba(255,255,255,0.3)';
                }
            }

            // ==================== 滑块UI ====================
            function updateSlidersUI() {
                toleranceValue.textContent = tolerance;
                toleranceSlider.value = tolerance;
                brushSizeValue.textContent = brushSize;
                brushSizeSlider.value = brushSize;
                featherValue.textContent = featherRadius;
                featherSlider.value = featherRadius;
                softBrushCheck.checked = softBrush;
                featherCheck.checked = featherEnabled;
                sliderFeatherGroup.style.display = featherEnabled ? 'flex' : 'none';
            }

            // ==================== 文件加载 ====================
            function handleFileUpload(e) {
                const file = e.target.files[0];
                if (file) loadImageFile(file);
                e.target.value = '';
            }

            function loadImageFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => loadImage(img);
                    img.onerror = () => showToast('图片加载失败，请重试');
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function loadImage(img) {
                let w = img.naturalWidth;
                let h = img.naturalHeight;
                const MAX_DIM = 3000;
                if (w > MAX_DIM || h > MAX_DIM) {
                    const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                }
                imageWidth = w;
                imageHeight = h;

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = imageWidth;
                tempCanvas.height = imageHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0, imageWidth, imageHeight);
                originalImageData = tempCtx.getImageData(0, 0, imageWidth, imageHeight);
                originalImage = img;

                alphaMask = new Uint8Array(imageWidth * imageHeight);
                alphaMask.fill(255);
                history = [];

                hasImage = true;
                isLoaded = true;

                emptyState.style.display = 'none';
                previewEmpty.style.display = 'none';
                statsPanel.style.display = 'flex';
                btnUndo.disabled = true;
                btnReset.disabled = false;
                btnDownload.disabled = false;
                btnAutoCut.disabled = false;
                btnInvert.disabled = false;

                mainCanvas.width = imageWidth;
                mainCanvas.height = imageHeight;
                previewCanvas.width = imageWidth;
                previewCanvas.height = imageHeight;

                fitCanvasToContainer();
                renderMainCanvas();
                renderPreview();
                updateStats();
                updateBrushCursor();

                showToast('图片加载成功');
            }

            // ==================== 画布适配 ====================
            function fitCanvasToContainer() {
                if (!hasImage) return;
                const containerRect = canvasArea.getBoundingClientRect();
                const padding = 40;
                const availableW = containerRect.width - padding;
                const availableH = containerRect.height - padding;
                const scaleW = availableW / imageWidth;
                const scaleH = availableH / imageHeight;
                displayScale = Math.min(scaleW, scaleH, 5);
                const displayW = imageWidth * displayScale;
                const displayH = imageHeight * displayScale;
                mainCanvas.style.width = displayW + 'px';
                mainCanvas.style.height = displayH + 'px';
                const rect = mainCanvas.getBoundingClientRect();
                scaleX = imageWidth / rect.width;
                scaleY = imageHeight / rect.height;
                updateBrushCursorSize();
            }

            // ==================== 渲染 ====================
            function renderMainCanvas() {
                if (!hasImage || !originalImageData || !alphaMask) return;
                const ctx = mainCanvas.getContext('2d');
                const imageData = ctx.createImageData(imageWidth, imageHeight);
                const data = imageData.data;
                const srcData = originalImageData.data;
                for (let i = 0; i < alphaMask.length; i++) {
                    const idx = i * 4;
                    const alpha = alphaMask[i];
                    data[idx] = srcData[idx];
                    data[idx + 1] = srcData[idx + 1];
                    data[idx + 2] = srcData[idx + 2];
                    data[idx + 3] = alpha;
                }
                ctx.putImageData(imageData, 0, 0);
            }

            function renderPreview() {
                if (!hasImage || !originalImageData || !alphaMask) return;
                const ctx = previewCanvas.getContext('2d');
                const imageData = ctx.createImageData(imageWidth, imageHeight);
                const data = imageData.data;
                const srcData = originalImageData.data;
                for (let i = 0; i < alphaMask.length; i++) {
                    const idx = i * 4;
                    const alpha = alphaMask[i];
                    data[idx] = srcData[idx];
                    data[idx + 1] = srcData[idx + 1];
                    data[idx + 2] = srcData[idx + 2];
                    data[idx + 3] = alpha;
                }
                ctx.putImageData(imageData, 0, 0);
                const previewBox = previewCanvas.parentElement;
                const boxW = previewBox.clientWidth - 8;
                const boxH = previewBox.clientHeight - 8;
                const scale = Math.min(boxW / imageWidth, boxH / imageHeight, 1);
                previewCanvas.style.width = (imageWidth * scale) + 'px';
                previewCanvas.style.height = (imageHeight * scale) + 'px';
            }

            function updateStats() {
                if (!hasImage || !alphaMask) return;
                let transparentCount = 0;
                for (let i = 0; i < alphaMask.length; i++) {
                    if (alphaMask[i] < 128) transparentCount++;
                }
                const total = alphaMask.length;
                const removedPercent = ((transparentCount / total) * 100).toFixed(1);
                const remainingPercent = (100 - parseFloat(removedPercent)).toFixed(1);
                statRemoved.textContent = removedPercent + '%';
                statRemaining.textContent = remainingPercent + '%';
                statProgress.style.width = remainingPercent + '%';
                statSize.textContent = imageWidth + ' × ' + imageHeight;
            }

            // ==================== 历史记录 ====================
            function pushHistory() {
                if (!alphaMask) return;
                const snapshot = new Uint8Array(alphaMask);
                history.push(snapshot);
                if (history.length > MAX_HISTORY) history.shift();
                btnUndo.disabled = false;
            }

            function undo() {
                if (history.length === 0 || !hasImage) return;
                alphaMask = history.pop();
                if (history.length === 0) btnUndo.disabled = true;
                renderMainCanvas();
                renderPreview();
                updateStats();
                showToast('已撤销');
            }

            function resetMask() {
                if (!hasImage) return;
                pushHistory();
                alphaMask.fill(255);
                renderMainCanvas();
                renderPreview();
                updateStats();
                showToast('已重置');
            }

            function invertMask() {
                if (!hasImage) return;
                pushHistory();
                for (let i = 0; i < alphaMask.length; i++) {
                    alphaMask[i] = 255 - alphaMask[i];
                }
                renderMainCanvas();
                renderPreview();
                updateStats();
                showToast('已反选');
            }

            // ==================== 坐标转换 ====================
            function getCanvasCoords(clientX, clientY) {
                const rect = mainCanvas.getBoundingClientRect();
                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;
                return {
                    x: Math.round(Math.max(0, Math.min(imageWidth - 1, x))),
                    y: Math.round(Math.max(0, Math.min(imageHeight - 1, y)))
                };
            }

            function getDisplayCoords(clientX, clientY) {
                const rect = mainCanvas.getBoundingClientRect();
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            // ==================== 魔棒工具 ====================
            function wandSelect(clickX, clickY) {
                if (!hasImage || !alphaMask || !originalImageData) return;
                const targetIdx = clickY * imageWidth + clickX;
                const targetColor = getPixelColor(originalImageData, clickX, clickY);
                if (!targetColor) return;
                pushHistory();
                const visited = new Uint8Array(imageWidth * imageHeight);
                const queue = [];
                let queueStart = 0;
                queue.push(targetIdx);
                visited[targetIdx] = 1;
                const toleranceSquared = (tolerance / 100) * 441.67;
                const toleranceSq = toleranceSquared * toleranceSquared;
                while (queueStart < queue.length) {
                    const idx = queue[queueStart++];
                    const px = idx % imageWidth;
                    const py = Math.floor(idx / imageWidth);
                    const color = getPixelColorAt(originalImageData, idx);
                    if (colorDistanceSq(color, targetColor) <= toleranceSq) {
                        alphaMask[idx] = 0;
                        if (px > 0 && !visited[idx - 1]) { visited[idx - 1] = 1; queue.push(idx - 1); }
                        if (px < imageWidth - 1 && !visited[idx + 1]) { visited[idx + 1] = 1; queue.push(idx + 1); }
                        if (py > 0 && !visited[idx - imageWidth]) { visited[idx - imageWidth] = 1; queue.push(idx - imageWidth); }
                        if (py < imageHeight - 1 && !visited[idx + imageWidth]) { visited[idx + imageWidth] = 1; queue.push(idx + imageWidth); }
                    }
                }
                if (featherEnabled) applyFeatherToMask();
                renderMainCanvas();
                renderPreview();
                updateStats();
            }

            // ==================== 画笔工具 (擦除/恢复) ====================
            function brushAt(x, y) {
                if (!hasImage || !alphaMask) return;
                const radius = Math.max(1, Math.floor(brushSize / 2));
                const isErase = currentTool === 'erase';
                const newAlpha = isErase ? 0 : 255;
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px < 0 || px >= imageWidth || py < 0 || py >= imageHeight) continue;
                        const distSq = dx * dx + dy * dy;
                        const radiusSq = radius * radius;
                        if (distSq > radiusSq) continue;
                        let opacity = 1.0;
                        if (softBrush) {
                            const dist = Math.sqrt(distSq);
                            const innerRadius = radius * 0.6;
                            if (dist > innerRadius) {
                                opacity = Math.max(0, 1 - (dist - innerRadius) / (radius - innerRadius));
                            }
                        }
                        const idx = py * imageWidth + px;
                        if (opacity >= 1) {
                            alphaMask[idx] = newAlpha;
                        } else if (opacity > 0) {
                            if (isErase) {
                                alphaMask[idx] = Math.max(0, Math.round(alphaMask[idx] - alphaMask[idx] * opacity));
                            } else {
                                alphaMask[idx] = Math.min(255, Math.round(alphaMask[idx] + (255 - alphaMask[idx]) * opacity));
                            }
                        }
                    }
                }
            }

            // ==================== 修复画笔工具 (水印消除) ====================
            function healAt(x, y) {
                if (!hasImage || !originalImageData || !alphaMask) return;
                const radius = Math.max(1, Math.floor(brushSize / 2));
                // 收集周围未修改的像素颜色作为参考
                const sampleRadius = radius + 2;
                const samples = [];
                for (let dy = -sampleRadius; dy <= sampleRadius; dy++) {
                    for (let dx = -sampleRadius; dx <= sampleRadius; dx++) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px < 0 || px >= imageWidth || py < 0 || py >= imageHeight) continue;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > sampleRadius) continue;
                        // 排除当前正在修改的区域（简单处理：不排除，但我们会用平均色替换）
                        const idx = py * imageWidth + px;
                        const srcIdx = idx * 4;
                        samples.push({
                            r: originalImageData.data[srcIdx],
                            g: originalImageData.data[srcIdx+1],
                            b: originalImageData.data[srcIdx+2]
                        });
                    }
                }
                if (samples.length === 0) return;
                // 计算平均颜色
                let avgR = 0, avgG = 0, avgB = 0;
                for (const s of samples) {
                    avgR += s.r; avgG += s.g; avgB += s.b;
                }
                avgR = Math.round(avgR / samples.length);
                avgG = Math.round(avgG / samples.length);
                avgB = Math.round(avgB / samples.length);

                // 应用颜色到画笔区域
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px < 0 || px >= imageWidth || py < 0 || py >= imageHeight) continue;
                        const distSq = dx * dx + dy * dy;
                        if (distSq > radius * radius) continue;
                        const idx = py * imageWidth + px;
                        const srcIdx = idx * 4;
                        // 修改原始图像数据中的颜色（保留alpha不变）
                        originalImageData.data[srcIdx] = avgR;
                        originalImageData.data[srcIdx+1] = avgG;
                        originalImageData.data[srcIdx+2] = avgB;
                        // 如果该像素已经透明，我们可能想要保留透明，但这里保留原alpha
                    }
                }
            }

            function brushLine(x1, y1, x2, y2) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const steps = Math.max(Math.abs(dx), Math.abs(dy));
                if (steps === 0) {
                    if (currentTool === 'heal') healAt(x1, y1);
                    else brushAt(x1, y1);
                    return;
                }
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = Math.round(x1 + dx * t);
                    const y = Math.round(y1 + dy * t);
                    if (currentTool === 'heal') healAt(x, y);
                    else brushAt(x, y);
                }
            }

            // ==================== 羽化 ====================
            function applyFeather() {
                if (!hasImage || !alphaMask) return;
                pushHistory();
                applyFeatherToMask();
                renderMainCanvas();
                renderPreview();
                updateStats();
                showToast('已应用羽化');
            }

            function applyFeatherToMask() {
                const radius = featherRadius;
                const tempMask = new Uint8Array(alphaMask);
                const kernelSize = radius * 2 + 1;
                const kernel = createGaussianKernel(radius);
                for (let y = 0; y < imageHeight; y++) {
                    for (let x = 0; x < imageWidth; x++) {
                        let sum = 0, weightSum = 0;
                        for (let ky = -radius; ky <= radius; ky++) {
                            for (let kx = -radius; kx <= radius; kx++) {
                                const px = x + kx;
                                const py = y + ky;
                                if (px < 0 || px >= imageWidth || py < 0 || py >= imageHeight) continue;
                                const weight = kernel[ky + radius][kx + radius];
                                sum += tempMask[py * imageWidth + px] * weight;
                                weightSum += weight;
                            }
                        }
                        if (weightSum > 0) alphaMask[y * imageWidth + x] = Math.round(sum / weightSum);
                    }
                }
            }

            function createGaussianKernel(radius) {
                const size = radius * 2 + 1;
                const kernel = [];
                const sigma = radius / 2;
                let sum = 0;
                for (let y = -radius; y <= radius; y++) {
                    kernel[y + radius] = [];
                    for (let x = -radius; x <= radius; x++) {
                        const val = Math.exp(-(x * x + y * y) / (2 * sigma * sigma));
                        kernel[y + radius][x + radius] = val;
                        sum += val;
                    }
                }
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        kernel[y][x] /= sum;
                    }
                }
                return kernel;
            }

            // ==================== 自动抠图 ====================
            function autoCut() {
                if (!hasImage || !alphaMask || !originalImageData) return;
                pushHistory();
                const corners = [
                    { x: 0, y: 0 }, { x: imageWidth - 1, y: 0 },
                    { x: 0, y: imageHeight - 1 }, { x: imageWidth - 1, y: imageHeight - 1 }
                ];
                let avgR = 0, avgG = 0, avgB = 0, validCorners = 0;
                for (const corner of corners) {
                    const color = getPixelColor(originalImageData, corner.x, corner.y);
                    if (color) {
                        avgR += color.r; avgG += color.g; avgB += color.b; validCorners++;
                    }
                }
                if (validCorners === 0) return;
                avgR = Math.round(avgR / validCorners);
                avgG = Math.round(avgG / validCorners);
                avgB = Math.round(avgB / validCorners);
                const bgColor = { r: avgR, g: avgG, b: avgB };
                const toleranceSquared = (tolerance / 100) * 441.67;
                const toleranceSq = toleranceSquared * toleranceSquared;
                const visited = new Uint8Array(imageWidth * imageHeight);
                const queue = [];
                let queueStart = 0;
                for (let x = 0; x < imageWidth; x++) {
                    const topIdx = x;
                    const bottomIdx = (imageHeight - 1) * imageWidth + x;
                    if (!visited[topIdx]) { visited[topIdx] = 1; queue.push(topIdx); }
                    if (!visited[bottomIdx]) { visited[bottomIdx] = 1; queue.push(bottomIdx); }
                }
                for (let y = 0; y < imageHeight; y++) {
                    const leftIdx = y * imageWidth;
                    const rightIdx = y * imageWidth + imageWidth - 1;
                    if (!visited[leftIdx]) { visited[leftIdx] = 1; queue.push(leftIdx); }
                    if (!visited[rightIdx]) { visited[rightIdx] = 1; queue.push(rightIdx); }
                }
                while (queueStart < queue.length) {
                    const idx = queue[queueStart++];
                    const px = idx % imageWidth;
                    const py = Math.floor(idx / imageWidth);
                    const color = getPixelColorAt(originalImageData, idx);
                    if (colorDistanceSq(color, bgColor) <= toleranceSq) {
                        alphaMask[idx] = 0;
                        if (px > 0 && !visited[idx - 1]) { visited[idx - 1] = 1; queue.push(idx - 1); }
                        if (px < imageWidth - 1 && !visited[idx + 1]) { visited[idx + 1] = 1; queue.push(idx + 1); }
                        if (py > 0 && !visited[idx - imageWidth]) { visited[idx - imageWidth] = 1; queue.push(idx - imageWidth); }
                        if (py < imageHeight - 1 && !visited[idx + imageWidth]) { visited[idx + imageWidth] = 1; queue.push(idx + imageWidth); }
                    }
                }
                if (featherEnabled) applyFeatherToMask();
                renderMainCanvas();
                renderPreview();
                updateStats();
                showToast('自动抠图完成');
            }

            function getPixelColor(imageData, x, y) {
                if (x < 0 || x >= imageWidth || y < 0 || y >= imageHeight) return null;
                const idx = (y * imageWidth + x) * 4;
                return { r: imageData.data[idx], g: imageData.data[idx+1], b: imageData.data[idx+2] };
            }

            function getPixelColorAt(imageData, pixelIdx) {
                const idx = pixelIdx * 4;
                return { r: imageData.data[idx], g: imageData.data[idx+1], b: imageData.data[idx+2] };
            }

            function colorDistanceSq(c1, c2) {
                const dr = c1.r - c2.r, dg = c1.g - c2.g, db = c1.b - c2.b;
                return dr*dr + dg*dg + db*db;
            }

            // ==================== 鼠标事件处理 ====================
            function handleMouseDown(e) {
                if (!hasImage || !isLoaded) return;
                e.preventDefault();
                const coords = getCanvasCoords(e.clientX, e.clientY);
                if (currentTool === 'wand') {
                    wandSelect(coords.x, coords.y);
                } else if (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal') {
                    isDrawing = true;
                    pushHistory();
                    lastDrawX = coords.x;
                    lastDrawY = coords.y;
                    if (currentTool === 'heal') healAt(coords.x, coords.y);
                    else brushAt(coords.x, coords.y);
                    renderMainCanvas();
                    renderPreview();
                    updateStats();
                }
            }

            function handleMouseMove(e) {
                if (!hasImage) return;
                const coords = getCanvasCoords(e.clientX, e.clientY);
                const displayCoords = getDisplayCoords(e.clientX, e.clientY);
                if (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal') {
                    brushCursor.style.display = 'block';
                    brushCursor.style.left = displayCoords.x + 'px';
                    brushCursor.style.top = displayCoords.y + 'px';
                }
                if (isDrawing && (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal')) {
                    e.preventDefault();
                    brushLine(lastDrawX, lastDrawY, coords.x, coords.y);
                    lastDrawX = coords.x;
                    lastDrawY = coords.y;
                    renderMainCanvas();
                    renderPreview();
                    updateStats();
                }
            }

            function handleMouseUp(e) {
                if (isDrawing) {
                    isDrawing = false;
                    lastDrawX = -1;
                    lastDrawY = -1;
                }
            }

            function handleMouseLeave(e) {
                if (isDrawing) {
                    const coords = getCanvasCoords(e.clientX, e.clientY);
                    if (coords.x >= 0 && coords.x < imageWidth && coords.y >= 0 && coords.y < imageHeight) {
                        brushLine(lastDrawX, lastDrawY, coords.x, coords.y);
                        lastDrawX = coords.x;
                        lastDrawY = coords.y;
                        renderMainCanvas();
                        renderPreview();
                        updateStats();
                    }
                }
                isDrawing = false;
                lastDrawX = -1;
                lastDrawY = -1;
                brushCursor.style.display = 'none';
            }

            function handleMouseEnter(e) {
                if (hasImage && (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal')) {
                    brushCursor.style.display = 'block';
                }
            }

            // ==================== 触摸事件 (单指绘制) ====================
            function handleTouchStart(e) {
                if (!hasImage || !isLoaded) return;
                if (e.touches.length === 1) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const coords = getCanvasCoords(touch.clientX, touch.clientY);
                    if (currentTool === 'wand') {
                        wandSelect(coords.x, coords.y);
                    } else if (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal') {
                        isDrawing = true;
                        pushHistory();
                        lastDrawX = coords.x;
                        lastDrawY = coords.y;
                        if (currentTool === 'heal') healAt(coords.x, coords.y);
                        else brushAt(coords.x, coords.y);
                        renderMainCanvas();
                        renderPreview();
                        updateStats();
                    }
                }
            }

            function handleTouchMove(e) {
                if (!hasImage) return;
                if (e.touches.length === 1) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const coords = getCanvasCoords(touch.clientX, touch.clientY);
                    const displayCoords = getDisplayCoords(touch.clientX, touch.clientY);
                    if (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal') {
                        brushCursor.style.display = 'block';
                        brushCursor.style.left = displayCoords.x + 'px';
                        brushCursor.style.top = displayCoords.y + 'px';
                    }
                    if (isDrawing && (currentTool === 'erase' || currentTool === 'restore' || currentTool === 'heal')) {
                        brushLine(lastDrawX, lastDrawY, coords.x, coords.y);
                        lastDrawX = coords.x;
                        lastDrawY = coords.y;
                        renderMainCanvas();
                        renderPreview();
                        updateStats();
                    }
                }
            }

            function handleTouchEnd(e) {
                isDrawing = false;
                lastDrawX = -1;
                lastDrawY = -1;
                brushCursor.style.display = 'none';
            }

            // ==================== 双指缩放 (画布容器) ====================
            function handleCanvasTouchStart(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                    initialScale = displayScale;
                }
            }

            function handleCanvasTouchMove(e) {
                if (e.touches.length === 2 && hasImage) {
                    e.preventDefault();
                    const dist = getDistance(e.touches[0], e.touches[1]);
                    const scaleFactor = dist / initialDistance;
                    let newScale = initialScale * scaleFactor;
                    newScale = Math.max(0.1, Math.min(10, newScale));
                    displayScale = newScale;
                    const displayW = imageWidth * displayScale;
                    const displayH = imageHeight * displayScale;
                    mainCanvas.style.width = displayW + 'px';
                    mainCanvas.style.height = displayH + 'px';
                    const rect = mainCanvas.getBoundingClientRect();
                    scaleX = imageWidth / rect.width;
                    scaleY = imageHeight / rect.height;
                    updateBrushCursorSize();
                }
            }

            function handleCanvasTouchEnd(e) {
                // 重置双指缩放状态
                initialDistance = 0;
                initialScale = displayScale;
            }

            function getDistance(t1, t2) {
                const dx = t2.clientX - t1.clientX;
                const dy = t2.clientY - t1.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // ==================== 滚轮缩放 ====================
            function handleWheel(e) {
                if (!hasImage) return;
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                const newScale = Math.max(0.1, Math.min(10, displayScale + delta));
                displayScale = newScale;
                const displayW = imageWidth * displayScale;
                const displayH = imageHeight * displayScale;
                mainCanvas.style.width = displayW + 'px';
                mainCanvas.style.height = displayH + 'px';
                const rect = mainCanvas.getBoundingClientRect();
                scaleX = imageWidth / rect.width;
                scaleY = imageHeight / rect.height;
                updateBrushCursorSize();
            }

            // ==================== 下载 ====================
            function downloadPNG() {
                if (!hasImage) return;
                const downloadCanvas = document.createElement('canvas');
                downloadCanvas.width = imageWidth;
                downloadCanvas.height = imageHeight;
                const ctx = downloadCanvas.getContext('2d');
                const imageData = ctx.createImageData(imageWidth, imageHeight);
                const data = imageData.data;
                const srcData = originalImageData.data;
                for (let i = 0; i < alphaMask.length; i++) {
                    const srcIdx = i * 4;
                    const alpha = alphaMask[i];
                    data[srcIdx] = srcData[srcIdx];
                    data[srcIdx+1] = srcData[srcIdx+1];
                    data[srcIdx+2] = srcData[srcIdx+2];
                    data[srcIdx+3] = alpha;
                }
                ctx.putImageData(imageData, 0, 0);
                const link = document.createElement('a');
                link.download = '抠图结果_' + Date.now() + '.png';
                link.href = downloadCanvas.toDataURL('image/png');
                link.click();
                showToast('下载成功');
            }

            // ==================== 重置画布 ====================
            function resetCanvas() {
                mainCanvas.width = 1;
                mainCanvas.height = 1;
                previewCanvas.width = 1;
                previewCanvas.height = 1;
                mainCanvas.style.width = 'auto';
                mainCanvas.style.height = 'auto';
                previewCanvas.style.width = 'auto';
                previewCanvas.style.height = 'auto';
                hasImage = false;
                isLoaded = false;
                originalImageData = null;
                originalImage = null;
                alphaMask = null;
                history = [];
                emptyState.style.display = 'flex';
                previewEmpty.style.display = 'block';
                statsPanel.style.display = 'none';
                btnUndo.disabled = true;
                btnReset.disabled = true;
                btnDownload.disabled = true;
                btnAutoCut.disabled = true;
                btnInvert.disabled = true;
                brushCursor.style.display = 'none';
                mainCanvas.style.cursor = 'crosshair';
                isDrawing = false;
                lastDrawX = -1;
                lastDrawY = -1;
            }

            // ==================== Toast ====================
            let toastTimeout = null;
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            init();
        })();
    </script>
</body>
